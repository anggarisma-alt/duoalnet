<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DUO AL NET</title>
  <meta name="theme-color" content="#F3F7FE">
  <meta name="description" content="DUO AL NET - pengelolaan pelanggan, tagihan, dan struk wifi lokal">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Koneksi awal lebih cepat -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Urutan CSS: library → aplikasi -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/mark.webp" type="image/webp">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="sig"><img src="img/mark.webp" alt="DUO AL NET" width="88" height="39"></div>
    <p class="mt-3 mb-0 fw-semibold">Menghubungkan ke server...</p>
    <noscript><p class="mt-3">Aktifkan JavaScript untuk memakai aplikasi ini.</p></noscript>
  </div>

  <header id="appHeader" class="app-header" style="display:none;">
    <div class="d-flex align-items-center gap-2 min-w-0">
      <img class="hdr-mark" src="img/mark.webp" alt="" width="64" height="28">
      <div class="min-w-0">
        <span class="wordmark" aria-label="DUO AL NET">DUO <b>AL</b> NET</span>
        <div class="hdr-sub"><span id="pageTitle" class="page-sub">Dashboard</span><span id="roleChip" class="chip"></span></div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="icon-btn" onclick="toggleDarkMode()" aria-label="Ganti mode gelap" title="Mode gelap"><i id="themeIcon" class="bi bi-moon-stars"></i></button>
      <button class="avatar" id="avatarBtn" onclick="openMenuSheet()" aria-label="Menu akun"></button>
    </div>
  </header>

  <div id="verBanner" class="alert-x alert-bad ver-banner" style="display:none" role="alert"></div>

  <nav id="mainNav" class="bottom-nav" style="display:none;" aria-label="Navigasi utama"></nav>

  <main id="mainContent" class="main-content">
    <div id="app-container"></div>
  </main>

  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="appModalDialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="appModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer" id="appModalFooter"></div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
  <div id="printArea"></div>

  <!-- Semua skrip defer; urutan: library → config → api → core → pages. Chart.js dimuat lazy saat Dashboard dibuka. -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/pages.js"></script>
</body>
</html>
